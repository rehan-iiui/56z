<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z56 Stopwatch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080b10;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .watch {
      width: 340px;
      min-height: 430px;
      padding: 28px 22px;
      border-radius: 48px;
      background: #05070a;
      border: 8px solid #151b23;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        inset 0 0 20px rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7f8a99;
      font-size: 13px;
      margin-bottom: 35px;
    }

    .title {
      text-align: center;
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 35px;
    }

    .display {
      text-align: center;
      font-size: 45px;
      font-weight: 700;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 42px;
    }

    .milliseconds {
      font-size: 23px;
      color: #7f8a99;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 15px 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: #171e27;
      transition: transform 0.15s, background 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #202a36;
    }

    #start {
      background: #173b29;
      color: #52e889;
    }

    #pause {
      background: #3d3420;
      color: #ffd45c;
    }

    #reset {
      grid-column: span 2;
      background: #321b22;
      color: #ff647b;
    }

    .hint {
      margin-top: auto;
      text-align: center;
      color: #596574;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="watch">

    <div class="top">
      <span>Z56</span>
      <span>STOPWATCH</span>
    </div>

    <div class="title">
      Stopwatch
    </div>

    <div class="display">
      <span id="minutes">00</span>:
      <span id="seconds">00</span>.
      <span class="milliseconds" id="milliseconds">00</span>
    </div>

    <div class="buttons">
      <button id="start">▶ Start</button>
      <button id="pause">⏸ Pause</button>
      <button id="reset">↺ Reset</button>
    </div>

    <div class="hint">
      Z56 Watch • Precision Stopwatch
    </div>

  </main>

  <script>
    let startTime = 0;
    let elapsedTime = 0;
    let timer = null;

    const minutes = document.getElementById("minutes");
    const seconds = document.getElementById("seconds");
    const milliseconds = document.getElementById("milliseconds");

    const startButton = document.getElementById("start");
    const pauseButton = document.getElementById("pause");
    const resetButton = document.getElementById("reset");

    function updateDisplay() {
      const time = elapsedTime;

      const mins = Math.floor(time / 60000);
      const secs = Math.floor((time % 60000) / 1000);
      const ms = Math.floor((time % 1000) / 10);

      minutes.textContent = String(mins).padStart(2, "0");
      seconds.textContent = String(secs).padStart(2, "0");
      milliseconds.textContent = String(ms).padStart(2, "0");
    }

    function startStopwatch() {
      if (timer !== null) return;

      startTime = Date.now() - elapsedTime;

      timer = setInterval(() => {
        elapsedTime = Date.now() - startTime;
        updateDisplay();
      }, 10);
    }

    function pauseStopwatch() {
      if (timer === null) return;

      clearInterval(timer);
      timer = null;
    }

    function resetStopwatch() {
      clearInterval(timer);
      timer = null;
      elapsedTime = 0;
      startTime = 0;
      updateDisplay();
    }

    startButton.addEventListener("click", startStopwatch);
    pauseButton.addEventListener("click", pauseStopwatch);
    resetButton.addEventListener("click", resetStopwatch);

    updateDisplay();
  </script>

</body>
</html>
